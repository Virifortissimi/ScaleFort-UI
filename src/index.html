  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(22, 198, 90, 0.24), transparent 28%),
        radial-gradient(circle at 82% 22%, rgba(245, 158, 11, 0.18), transparent 22%),
        linear-gradient(135deg, #03140a 0%, #0a2a17 45%, #0b1110 100%);
      transition: opacity 420ms ease, visibility 420ms ease;
    }

    #app-loader::before,
    #app-loader::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      animation: loaderFloat 4.8s ease-in-out infinite;
    }

    #app-loader::before {
      width: 22rem;
      height: 22rem;
      background: rgba(22, 198, 90, 0.1);
      top: -6rem;
      right: -4rem;
    }

    #app-loader::after {
      width: 18rem;
      height: 18rem;
      background: rgba(245, 158, 11, 0.08);
      bottom: -5rem;
      left: -4rem;
      animation-delay: -2.2s;
    }

    .app-loader__panel {
      position: relative;
      width: min(92vw, 30rem);
      padding: 2rem 1.75rem;
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
      text-align: center;
      color: #f7faf7;
    }

    .app-loader__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(240, 255, 244, 0.8);
      font: 600 0.72rem/1 "DM Sans", system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .app-loader__eyebrow::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #7bf0ac, #16c65a);
      box-shadow: 0 0 0 0 rgba(22, 198, 90, 0.55);
      animation: loaderPulse 1.8s ease-out infinite;
    }

    .app-loader__orbital {
      position: relative;
      width: 10rem;
      height: 10rem;
      margin: 1.35rem auto 1.15rem;
    }

    .app-loader__ring,
    .app-loader__ring--inner {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .app-loader__ring {
      animation: loaderSpin 10s linear infinite;
    }

    .app-loader__ring::before,
    .app-loader__ring::after,
    .app-loader__ring--inner::before {
      content: "";
      position: absolute;
      border-radius: 999px;
    }

    .app-loader__ring::before {
      width: 0.9rem;
      height: 0.9rem;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      top: 0.7rem;
      left: 1.55rem;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.45);
    }

    .app-loader__ring::after {
      width: 0.6rem;
      height: 0.6rem;
      background: linear-gradient(135deg, #a7f3d0, #16c65a);
      right: 1.1rem;
      bottom: 1.6rem;
      box-shadow: 0 0 16px rgba(22, 198, 90, 0.35);
    }

    .app-loader__ring--inner {
      inset: 1.05rem;
      border-color: rgba(255, 255, 255, 0.18);
      animation: loaderSpinReverse 7s linear infinite;
    }

    .app-loader__ring--inner::before {
      width: 0.5rem;
      height: 0.5rem;
      background: #ffffff;
      left: 0.95rem;
      bottom: 0.95rem;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.35);
    }

    .app-loader__core {
      position: absolute;
      inset: 2.2rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 35%),
        linear-gradient(145deg, rgba(22, 198, 90, 0.95), rgba(14, 138, 62, 0.88));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 18px 36px rgba(10, 42, 23, 0.3);
    }

    .app-loader__mark {
      font: 800 1.65rem/1 "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
      letter-spacing: -0.05em;
      color: #ffffff;
    }

    .app-loader__title {
      margin: 0;
      font: 800 clamp(2rem, 4vw, 2.8rem)/1 "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
      letter-spacing: -0.06em;
      color: #ffffff;
    }

    .app-loader__subline {
      margin: 0.65rem auto 1rem;
      max-width: 22rem;
      color: rgba(240, 255, 244, 0.8);
      font: 500 0.98rem/1.55 "DM Sans", system-ui, sans-serif;
      text-transform: lowercase;
    }

    .app-loader__progress {
      position: relative;
      height: 0.4rem;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .app-loader__progress::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255,255,255,0), #7bf0ac 22%, #fbbf24 55%, rgba(255,255,255,0));
      animation: loaderSweep 1.55s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    .app-loader__caption {
      margin-top: 0.9rem;
      color: rgba(240, 255, 244, 0.62);
      font: 500 0.8rem/1.5 "DM Sans", system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .app-loader--exit {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes loaderSpinReverse {
      to { transform: rotate(-360deg); }
    }

    @keyframes loaderSweep {
      100% { transform: translateX(100%); }
    }

    @keyframes loaderPulse {
      0% { box-shadow: 0 0 0 0 rgba(22, 198, 90, 0.55); }
      100% { box-shadow: 0 0 0 12px rgba(22, 198, 90, 0); }
    }

    @keyframes loaderFloat {
      50% { transform: translateY(1.5rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader,
      #app-loader::before,
      #app-loader::after,
      .app-loader__ring,
      .app-loader__ring--inner,
      .app-loader__progress::before,
      .app-loader__eyebrow::before {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app-loader" aria-live="polite" aria-busy="true">
    <div class="app-loader__panel">
      <span class="app-loader__eyebrow">booting scalefort</span>
      <div class="app-loader__orbital" aria-hidden="true">
        <div class="app-loader__ring"></div>
        <div class="app-loader__ring--inner"></div>
        <div class="app-loader__core">
          <span class="app-loader__mark">sf</span>
        </div>
      </div>
      <h1 class="app-loader__title">Scalefort</h1>
      <p class="app-loader__subline">building your learning, products, and team momentum.</p>
      <div class="app-loader__progress"></div>
      <div class="app-loader__caption">launch sequence in progress</div>
    </div>
  </div>
